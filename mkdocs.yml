site_name: 營造業線上申請系統指南
site_url: https://heke0621.github.io/online_system_tutorial/
theme:
  name: material
  language: zh-Hant
  icon:
    admonition:
      <type>: octicons/alert-16 
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.top

  palette:

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
dev_addr: 127.0.0.1:8000
extra_css:
  - 'css/custom.css'
  - 'css/simpleLightbox.min.css'

extra_javascript:
  - 'js/jquery-3.2.1.min.js'
  - 'js/simpleLightbox.min.js'
  - 'js/custom.js'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
        custom_fences:
          - name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - markdown.extensions.attr_list
  - meta

plugins:
  - search
  - tags
  - social:
  
      #cards_layout_dir: layouts
      cards_layout: default
      cards_layout_options:
        background_color: transparent
        background_image: layouts/Gemini_Generated_Image_y1pvawy1pvawy1pv.png
        font_family: Noto Sans TC
        description: 內政部國土署114年度營造業登記線上化系統操作指南
      #debug: true

extra:
  generator: false

copyright: Copyright &copy;  2026 CHEN YU AN，All rights reserved.


